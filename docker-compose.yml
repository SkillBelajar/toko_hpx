services:
  app:
    build: .
    container_name: tokohpx_app
    working_dir: /var/www/html
    command: sh -c "php artisan config:clear && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000"
    volumes:
      - .:/var/www/html:cached
      - ./.env:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [tokohpx]
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: tokohpx_web
    ports:
      - "8091:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on: [app]
    networks: [tokohpx]
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: tokohpx_db
    environment:
      MYSQL_DATABASE: tokohpx
      MYSQL_USER: tokohpx
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tokohpx]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tokohpx_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [tokohpx]
    restart: unless-stopped

networks:
  tokohpx:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
