services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokohpx_app
    working_dir: /var/www/html
    environment:
      # Override lewat shell: APP_ENV=local docker compose up -d
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    volumes:
      - .:/var/www/html:cached
      - ./.env:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [tokohpx]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: nginx:alpine
    container_name: tokohpx_web
    ports:
      - "${APP_PORT:-8091}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on: [app]
    networks: [tokohpx]
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: tokohpx_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tokohpx}
      MYSQL_USER: ${DB_USERNAME:-tokohpx}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tokohpx]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tokohpx_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [tokohpx]
    restart: unless-stopped

networks:
  tokohpx:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
